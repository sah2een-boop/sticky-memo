<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sticky Memo</title>
    <meta name="description" content="跨裝置即時同步便利貼牆">
    <meta name="theme-color" content="#6366f1">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzYzNjZmMSI+PHBhdGggZD0iTTE5IDNINWMtMS4xIDAtMiAuOS0yIDJ2MTRjMCAxLjEuOSAyIDIgMmgxNGMxLjEgMCAyLS45IDItMlY1YzAtMS4xLS45LTItMi0yem0wIDE2SDVWNWgxNHYxNHoiLz48cGF0aCBkPSJNMTQgMTdIN3YtMmg3djJ6bTMtNEg3di0yaDEwdjJ6bTAtNEg3VjdoMTB2MnoiLz48L3N2Zz4=">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loader">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>
        <div class="loader-text">Sticky Memo</div>
    </div>

    <!-- Top Bar -->
    <header id="top-bar">
        <div class="top-bar-left">
            <button id="sidebar-toggle" class="icon-btn-round" title="牆面列表" onclick="App.toggleSidebar()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div class="wall-name-display">
                <span id="current-wall-name">預設牆面</span>
                <span id="note-count" class="note-count-badge">0</span>
            </div>
        </div>
        <div class="top-bar-center" id="toolbar-colors">
            <button onclick="App.setColor('yellow')" class="color-dot color-dot-yellow active" data-color="yellow" title="黃色"></button>
            <button onclick="App.setColor('pink')" class="color-dot color-dot-pink" data-color="pink" title="粉紅"></button>
            <button onclick="App.setColor('blue')" class="color-dot color-dot-blue" data-color="blue" title="藍色"></button>
            <button onclick="App.setColor('green')" class="color-dot color-dot-green" data-color="green" title="綠色"></button>
            <button onclick="App.setColor('orange')" class="color-dot color-dot-orange" data-color="orange" title="橘色"></button>
            <button onclick="App.setColor('purple')" class="color-dot color-dot-purple" data-color="purple" title="紫色"></button>
            <button onclick="App.setColor('gray')" class="color-dot color-dot-gray" data-color="gray" title="灰色"></button>
        </div>
        <div class="top-bar-right">
            <button id="search-toggle" class="icon-btn-round" title="搜尋 (/)" onclick="App.toggleSearch()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button id="tidy-btn" class="icon-btn-round" title="整理排列" onclick="App.tidyNotes()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="14" y2="12"/><line x1="4" y1="18" x2="9" y2="18"/></svg>
            </button>
            <button id="cloud-btn" class="icon-btn-round cloud-offline" title="雲端房間" onclick="App.openAuthModal()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            </button>
        </div>
    </header>

    <!-- Search Bar (hidden by default) -->
    <div id="search-bar" class="search-bar hidden">
        <div class="search-bar-inner">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="搜尋便利貼..." autocomplete="off">
            <button class="search-clear" onclick="App.clearSearch()">✕</button>
        </div>
    </div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h2>牆面管理</h2>
            <button class="icon-btn-round" onclick="App.toggleSidebar()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="sidebar-walls" id="sidebar-walls"></div>
        <div class="sidebar-actions">
            <button class="sidebar-action-btn" onclick="App.promptAddWall()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新增牆面
            </button>
        </div>
        <div class="sidebar-footer">
            <button id="theme-toggle" class="sidebar-footer-btn" onclick="Theme.toggle()" title="深色模式 (D)">
                <svg id="theme-icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <svg id="theme-icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
                深色模式
            </button>
            <button class="sidebar-footer-btn" onclick="App.exportBackup()" title="備份">📥 備份</button>
            <button class="sidebar-footer-btn" onclick="App.importBackup()" title="匯入">📤 匯入</button>
        </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="App.toggleSidebar()"></div>

    <!-- Wall Container -->
    <main id="wall" class="wall"></main>

    <!-- Chat Container (for chat wall mode) -->
    <div id="chat-wrapper" class="chat-wrapper hidden">
        <div id="chat-messages" class="chat-messages">
            <div id="chat-message-list"></div>
        </div>
        <div id="chat-input-bar" class="chat-input-bar">
            <input type="file" id="chat-file-input" style="display:none" multiple>
            <button id="chat-attach-btn" class="chat-btn-icon" onclick="document.getElementById('chat-file-input').click()" title="上傳檔案/圖片">📎</button>
            <textarea id="chat-text-input" class="chat-text-input" placeholder="輸入訊息... (Enter 送出，Shift+Enter 換行，支援 Ctrl+V 貼圖)" rows="1"></textarea>
            <button id="chat-send-btn" class="chat-btn-send" onclick="Chat.handleSendClick()" title="送出訊息">➤</button>
        </div>
    </div>

    <!-- FAB: Add Note -->
    <button id="fab-add" class="fab" onclick="App.createNote()" title="新增便利貼 (N)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>

    <!-- Mobile Bottom Toolbar (visible on mobile only) -->
    <div id="mobile-toolbar" class="mobile-toolbar">
        <div class="mobile-toolbar-colors">
            <button onclick="App.setColor('yellow')" class="color-dot color-dot-yellow active" data-color="yellow"></button>
            <button onclick="App.setColor('pink')" class="color-dot color-dot-pink" data-color="pink"></button>
            <button onclick="App.setColor('blue')" class="color-dot color-dot-blue" data-color="blue"></button>
            <button onclick="App.setColor('green')" class="color-dot color-dot-green" data-color="green"></button>
            <button onclick="App.setColor('orange')" class="color-dot color-dot-orange" data-color="orange"></button>
            <button onclick="App.setColor('purple')" class="color-dot color-dot-purple" data-color="purple"></button>
            <button onclick="App.setColor('gray')" class="color-dot color-dot-gray" data-color="gray"></button>
        </div>
        <div class="mobile-toolbar-actions">
            <select id="size-select-mobile" onchange="App.setSize(this.value)">
                <option value="small">小</option>
                <option value="medium" selected>中</option>
                <option value="large">大</option>
            </select>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-backdrop" onclick="App.closeAuthModal()"></div>
        <div class="modal-card">
            <div class="modal-card-glow"></div>
            <h3 class="modal-title">☁️ 雲端房間</h3>
            <div id="auth-logged-out">
                <p class="modal-desc">輸入專屬房間名稱與密碼，即可在不同裝置間同步你的便利貼。</p>
                <p class="modal-hint">⚠️ 第一次輸入的房間名會自動建立，請記住你的密碼</p>
                <input type="text" id="auth-room-input" class="modal-input" placeholder="房間名稱（英數字）" autocomplete="off">
                <input type="password" id="auth-pwd-input" class="modal-input" placeholder="密碼（至少 6 個字元）" autocomplete="off">
                <button class="modal-btn-primary" onclick="App.enterRoom()">進入房間</button>
            </div>
            <div id="auth-logged-in" class="hidden">
                <p class="modal-desc">目前房間：</p>
                <p class="modal-room-name" id="auth-current-room"></p>
                <div style="display:flex; gap:8px; margin-top:12px;">
                    <button class="modal-btn-secondary" style="flex:1" onclick="App.leaveRoom()">離開房間</button>
                    <button class="modal-btn-danger" style="flex:1" onclick="App.deleteRoom()">🗑️ 刪除房間</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Wall Management Modal -->
    <div id="wall-modal" class="modal-overlay hidden">
        <div class="modal-backdrop" onclick="App.closeWallModal()"></div>
        <div class="modal-card">
            <h3 class="modal-title" id="wall-modal-title">牆面管理</h3>
            <div id="wall-modal-input-group">
                <input type="text" id="wall-modal-input" class="modal-input" placeholder="牆面名稱">
                <div id="wall-modal-type-group" style="margin-bottom: 16px;">
                    <label style="font-size: 0.82rem; font-weight: 700; color: var(--text-secondary); display: block; margin-bottom: 6px;">牆面模式：</label>
                    <div style="display: flex; gap: 8px;">
                        <label style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem;" class="wall-type-option">
                            <input type="radio" name="wall-type" value="sticky" checked>
                            <span>🗒️ 便利貼</span>
                        </label>
                        <label style="flex: 1; display: flex; align-items: center; gap: 6px; padding: 8px 10px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 0.85rem;" class="wall-type-option">
                            <input type="radio" name="wall-type" value="chat">
                            <span>💬 對話牆</span>
                        </label>
                    </div>
                </div>
            </div>
            <p id="wall-modal-desc" class="modal-desc hidden"></p>
            <div class="modal-actions">
                <button class="modal-btn-secondary" onclick="App.closeWallModal()">取消</button>
                <button class="modal-btn-primary" onclick="App.confirmWallModal()">確定</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <!-- Image Lightbox Modal -->
    <div id="image-lightbox" class="lightbox-overlay hidden" onclick="Notes.closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightbox-img" src="" alt="放大預覽">
            <button class="lightbox-close" onclick="Notes.closeLightbox()" title="關閉預覽">✕</button>
            <div id="lightbox-caption" class="lightbox-caption"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/search.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/walls.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
        }
    </script>
</body>
</html>
